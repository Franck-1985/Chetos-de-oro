<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro · Chetos de Oro</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body data-page="registro">
<header id="site-header"></header>
<main class="auth-wrap"><div class="auth-card">
  <h1>Crea tu cuenta</h1><p class="sub">Necesitas registrarte antes de votar.</p>
  <form id="auth-form" data-mode="register" novalidate>
    <div class="field"><label for="name">Nombre</label><input id="name" name="name" autocomplete="name" required></div>
    <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><small>Mínimo 8 caracteres.</small></div>
    <div class="field"><label for="password2">Repite la contraseña</label><input id="password2" name="password2" type="password" autocomplete="new-password" required></div>
    <p class="form-error" id="form-error" role="alert"></p>
    <button class="btn btn-block" type="submit">CREAR CUENTA</button>
  </form>
  <p class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
</div></main>
<script src="js/main.js"></script><script src="js/auth.js"></script>
</body></html>
